<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Buku Tamu Digital</h1>

        <form id="wishbox-form">
            <input type="text" id="name" placeholder="Nama Anda" required>
            <textarea id="message" placeholder="Tulis harapan atau ucapan Anda di sini..." required></textarea>
            <button type="submit" id="submit-btn">Kirim Ucapan</button>
        </form>

        <hr>

        <h2>Ucapan Terbaru</h2>
        <div id="wishbox-entries">
            <p id="status-text">Memuat ucapan...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ==========================================
        // PENTING: GANTI DENGAN DATA SUPABASE KAMU DI SINI
        // ==========================================
        const SUPABASE_URL = 'MASUKKAN_URL_SUPABASE_DISINI'; 
        const SUPABASE_ANON_KEY = 'MASUKKAN_ANON_KEY_DISINI'; 

        // Cek apakah data API sudah diisi dengan benar
        if (SUPABASE_URL.includes('MASUKKAN') || SUPABASE_ANON_KEY.includes('MASUKKAN')) {
            alert("Kunci Supabase belum dimasukkan ke dalam kode HTML!");
        }

        // Menghubungkan ke Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('wishbox-form');
        const nameInput = document.getElementById('name');
        const messageInput = document.getElementById('message');
        const entriesContainer = document.getElementById('wishbox-entries');

        // Fungsi Mengambil Ucapan (Fetch)
        async function fetchWishes() {
            try {
                const { data, error } = await supabase
                    .from('wishes')
                    .select('*')
                    .order('created_at', { ascending: false });

                // Jika terjadi error koneksi atau ditolak RLS
                if (error) {
                    console.error(error);
                    entriesContainer.innerHTML = `<p style="color: red; text-align: center; font-weight: bold; padding: 10px;">
                        Gagal memuat database!<br>
                        Pesan Error: ${error.message} (${error.code})
                    </p>`;
                    return;
                }

                // Jika database terhubung tetapi belum ada isinya
                if (!data || data.length === 0) {
                    entriesContainer.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">Belum ada ucapan. Yuk tulis ucapan pertama!</p>';
                    return;
                }

                // Jika data sukses diambil, tampilkan ke layar berderet ke bawah
                entriesContainer.innerHTML = data.map(wish => `
                    <div class="entry-card">
                        <div class="entry-name">${escapeHTML(wish.name)}</div>
                        <div class="entry-message">${escapeHTML(wish.message)}</div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                entriesContainer.innerHTML = `<p style="color: red; text-align: center; padding: 10px;">Error Sistem: ${err.message}</p>`;
            }
        }

        // Fungsi Mengirim Ucapan (Submit Form)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = nameInput.value.trim();
            const message = messageInput.value.trim();
            const submitBtn = document.getElementById('submit-btn');

            // Validasi: Munculkan alert jika user maksa kirim teks kosong
            if (!name) {
                alert("Nama Anda belum diisi!");
                nameInput.focus();
                return;
            }
            if (!message) {
                alert("Harapan atau ucapan Anda belum diisi!");
                messageInput.focus();
                return;
            }

            // Kunci tombol agar user tidak spam klik saat loading
            submitBtn.disabled = true;
            submitBtn.innerText = 'Mengirim...';

            try {
                const { error } = await supabase
                    .from('wishes')
                    .insert([{ name, message }]);

                if (error) {
                    alert(`Gagal mengirim ucapan: ${error.message}`);
                    console.error(error);
                } else {
                    form.reset(); // Mengosongkan form input jika sukses
                    await fetchWishes(); // Perbarui daftar ucapan secara instan di bawah
                }
            } catch (err) {
                alert(`Error Sistem: ${err.message}`);
            } finally {
                // Kembalikan tombol ke kondisi aktif semula
                submitBtn.disabled = false;
                submitBtn.innerText = 'Kirim Ucapan';
            }
        });

        // Fungsi Pengaman XSS (Anti-Hacker Iseng)
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Jalankan fungsi fetch otomatis setiap kali halaman web dibuka
        fetchWishes();
    </script>
</body>
</html>
