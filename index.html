<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Buku Tamu Digital</h1>

        <form id="wishbox-form">
            <input type="text" id="name" placeholder="Nama Anda" required>
            <textarea id="message" placeholder="Tulis harapan atau ucapan Anda di sini..." required></textarea>
            <button type="submit" id="submit-btn">Kirim Ucapan</button>
        </form>

        <hr>

        <h2>Ucapan Terbaru</h2>
        <div id="wishbox-entries">
            <p id="status-text">Memuat ucapan...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // DATA ASLI PROYEK SUPABASE LU (SUDAH FIX)
        const SUPABASE_URL = 'https://gcmhpaopnhnaekvlaxpr.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjbWhwYW9wbmhuYWVrdmxheHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTc2NTcyMDAsImV4cCI6MjAzMzIzMzIwMH0.3R3uB-Cg9-yofcK2v_v-tB1o1k3B2_rYgE6O6R3uB-C'; 

        // Hubungkan ke Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('wishbox-form');
        const nameInput = document.getElementById('name');
        const messageInput = document.getElementById('message');
        const entriesContainer = document.getElementById('wishbox-entries');

        // Fungsi Mengambil Ucapan (Fetch)
        async function fetchWishes() {
            try {
                const { data, error } = await supabase
                    .from('wishes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error(error);
                    entriesContainer.innerHTML = `<p style="color: red; text-align: center; font-weight: bold; padding: 10px;">
                        Gagal memuat database!<br>
                        Pesan Error: ${error.message}
                    </p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    entriesContainer.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">Belum ada ucapan. Yuk tulis ucapan pertama!</p>';
                    return;
                }

                entriesContainer.innerHTML = data.map(wish => `
                    <div class="entry-card">
                        <div class="entry-name">${escapeHTML(wish.name)}</div>
                        <div class="entry-message">${escapeHTML(wish.message)}</div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                entriesContainer.innerHTML = `<p style="color: red; text-align: center; padding: 10px;">Error Sistem: ${err.message}</p>`;
            }
        }

        // Fungsi Mengirim Ucapan (Submit Form)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = nameInput.value.trim();
            const message = messageInput.value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (!name) {
                alert("Nama Anda belum diisi!");
                nameInput.focus();
                return;
            }
            if (!message) {
                alert("Harapan atau ucapan Anda belum diisi!");
                messageInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Mengirim...';

            try {
                const { error } = await supabase
                    .from('wishes')
                    .insert([{ name, message }]);

                if (error) {
                    alert(`Gagal mengirim ucapan: ${error.message}`);
                    console.error(error);
                } else {
                    form.reset();
                    await fetchWishes(); // Langsung tampilin ucapan baru di bawah otomatis
                }
            } catch (err) {
                alert(`Error Sistem: ${err.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Kirim Ucapan';
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        fetchWishes();
    </script>
</body>
</html>
